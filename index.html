<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Familjen Åhlunds Secret Santa 🎅</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    /* --- JULBAKGRUND --- */
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: url("https://images.unsplash.com/photo-1543589077-47d81606c1bf?auto=format&fit=crop&w=800&q=60")
                  no-repeat center/cover;
      min-height: 100vh;
      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center; /* ← EXAKT CENTRERAD */
    }

    /* --- FÄRGER --- */
    :root {
      --rosa: rgba(255, 210, 220, 0.92);
      --rosa-dark: #d47a8c;
      --rosa-hover: #b85f72;
      --result-color: #0f7a0f;
      --confetti-gold: #d4a017;
    }

    /* --- RUTA --- */
    .page-box {
      background: var(--rosa);
      width: min(95%, 700px);
      height: 50vh; /* ← 50vh som du ville */
      padding: 25px 25px;
      border-radius: 25px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
      backdrop-filter: blur(5px);

      display: none;

      flex-direction: column;
      justify-content: flex-start;
      align-items: center;

      overflow-y: auto;
      text-align: center;

      position: relative;
    }

    /* Mindre luft på välkomstsidan */
    #welcome-section {
      padding-top: 10px;
    }

    /* Mer luft på sida 2 och 3 */
    #confirm-section,
    #main-section {
      padding-top: 65px;
    }

    /* --- TEXT --- */
    .title-biggest {
      font-size: clamp(44px, 11vw, 70px);
      font-weight: 800;
      line-height: 1.2;
      white-space: pre-line;
      margin-bottom: 10px;
    }

    .emoji-line {
      font-size: clamp(40px, 10vw, 60px);
      margin: 10px 0 20px 0;
    }

    .subtitle-large {
      font-size: clamp(34px, 9vw, 52px);
      font-weight: 600;
      margin-bottom: 20px;
    }

    .name-medium {
      font-size: clamp(34px, 9vw, 52px);
      font-weight: 700;
    }

    .name-big {
      font-size: clamp(58px, 14vw, 90px);
      font-weight: 800;
      color: var(--result-color);
      margin-top: 25px;
      line-height: 1.3;
    }

    /* --- PIN --- */
    .pin-wrapper {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 20px;
    }

    .pin-input {
      width: 75px;
      height: 90px;
      font-size: clamp(36px, 10vw, 52px);
      text-align: center;
      border: 2px solid #aaa;
      border-radius: 12px;
      background: white;
    }

    /* --- KNAPPAR --- */
    button {
      padding: 16px;
      font-size: clamp(28px, 8vw, 42px);
      font-weight: 700;
      background: var(--rosa-dark);
      color: white;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.2s;
    }

    /* --- RESULTAT --- */
    #result {
      margin-top: 20px;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.4s ease, transform 0.4s ease;
      white-space: pre-line;
      line-height: 1.35;
    }

    .reveal {
      opacity: 1 !important;
      transform: scale(1) !important;
    }

    /* --- GULD-KONFETTI --- */
    .confetti {
      position: fixed;
      width: 18px;
      height: 18px;
      border-radius: 3px;
      opacity: 0.95;
      background: var(--confetti-gold);
      animation: explode 1.4s ease-out forwards;
    }

    @keyframes explode {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0.6) rotate(720deg); opacity: 0; }
    }

    /* --- BÖRJA OM-KNAPP --- */
    .restart-btn {
      position: absolute;
      bottom: 15px;
      right: 15px;
      font-size: 20px;
      padding: 10px 16px;
      background: var(--rosa-dark);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .restart-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

  </style>
</head>

<body>

  <!-- STARTSKÄRM -->
  <div id="welcome-section" class="page-box">
    <div class="title-biggest">
Välkommen till
Familjen Åhlunds
superhäftiga 
secret santa-lotteri!
    </div>

    <!-- PRESENT-EMOJI PÅ EGEN RAD -->
    <div class="emoji-line">🎁</div>

    <div class="subtitle-large">Skriv in din pinkod</div>

    <div class="pin-wrapper">
      <input id="pin-0" maxlength="1" class="pin-input" inputmode="numeric" type="tel" />
      <input id="pin-1" maxlength="1" class="pin-input" inputmode="numeric" type="tel" />
      <input id="pin-2" maxlength="1" class="pin-input" inputmode="numeric" type="tel" />
      <input id="pin-3" maxlength="1" class="pin-input" inputmode="numeric" type="tel" />
    </div>

    <button id="pin-submit" disabled>Fortsätt</button>
    <p id="pin-error" class="normal-text" style="color:red;"></p>
  </div>

  <!-- BEKRÄFTA NAMN -->
  <div id="confirm-section" class="page-box">
    <div id="confirm-text" class="title-biggest"></div>
    <button id="confirm-yes">Ja</button>
    <button id="confirm-no" style="margin-top:20px;">Nej</button>
  </div>

  <!-- HUVUDSIDA -->
  <div id="main-section" class="page-box">
    <div class="title-biggest">🎅 Secret Santa</div>

    <div class="subtitle-large">Du är inloggad som</div>
    <div id="logged-in-name" class="name-medium"></div>

    <button id="draw-button">Dra namn</button>

    <p id="result"></p>

    <button id="restart-button" class="restart-btn">Börja om</button>
  </div>

  <script>
    /* ---------------------------------------------------
       VISA EN SIDA
    --------------------------------------------------- */
    function showPage(id) {
      document.querySelectorAll(".page-box").forEach(box => box.style.display = "none");
      document.getElementById(id).style.display = "flex";
      window.scrollTo(0, 0);
    }

    /* ---------------------------------------------------
       GULD-KONFETTI EXPLOSION
    --------------------------------------------------- */
    function launchConfettiFromElement(el) {
      const rect = el.getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height / 2;

      for (let i = 0; i < 180; i++) {
        const c = document.createElement("div");
        c.classList.add("confetti");

        const angle = Math.random() * 2 * Math.PI;
        const distance = 500 + Math.random() * 150;

        c.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
        c.style.setProperty("--dy", `${Math.sin(angle) * distance}px`);

        c.style.left = originX + "px";
        c.style.top = originY + "px";

        document.body.appendChild(c);
        setTimeout(() => c.remove(), 1600);
      }
    }

    /* ---------------------------------------------------
       RESET FUNKTION
    --------------------------------------------------- */
    function resetAll() {
      sessionStorage.clear();

      document.querySelectorAll(".pin-input").forEach(i => i.value = "");
      document.getElementById("pin-error").innerText = "";
      document.getElementById("result").innerText = "";
      document.getElementById("result").classList.remove("reveal");
      document.getElementById("logged-in-name").innerText = "";

      document.getElementById("restart-button").classList.remove("visible");

      document.querySelectorAll(".confetti").forEach(c => c.remove());
    }

    /* ---------------------------------------------------
       STARTSKÄRM
    --------------------------------------------------- */
    document.addEventListener("DOMContentLoaded", () => {
      resetAll();
      showPage("welcome-section");

      const savedUser = sessionStorage.getItem("loggedInUser");
      if (savedUser) {
        currentUserName = savedUser;
        showPage("main-section");
        document.getElementById("logged-in-name").innerText = savedUser;
        return;
      }

      const inputs = document.querySelectorAll(".pin-input");
      const submitBtn = document.getElementById("pin-submit");

      inputs[0].focus();

      inputs.forEach((input, index) => {
        input.addEventListener("input", () => {
          input.value = input.value.replace(/[^0-9]/g, "");

          if (input.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }

          const pin = [...inputs].map(i => i.value).join("");
          submitBtn.disabled = pin.length !== 4;

          if (pin.length === 4) submitBtn.focus();
        });

        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && !input.value && index > 0) {
            inputs[index - 1].focus();
          }
        });
      });
    });

    /* ---------------------------------------------------
       SUPABASE
    --------------------------------------------------- */
    const SUPABASE_URL = "https://qktwixlydcpjuvnbgxza.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrdHdpeGx5ZGNwanV2bmJneHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYwODE3NzgsImV4cCI6MjA4MTY1Nzc3OH0.9Z4yEXtsO6rXPutvzmymFeu-KvQA4_604pJfDt0XzQU";

    const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const PARTICIPANTS = [
      "Iren","Jonas","Joakim","Dunis","Juli","Sam","Klas","Martha",
      "Ia","Lita","Kennedy","Johannes","Rebecka","Betty","Bodil",
      "Anna","Essi","Udo"
    ];

    const groupId = "familj2025";
    let currentUserName = null;

    /* ---------------------------------------------------
       PIN-KONTROLL
    --------------------------------------------------- */
    document.getElementById("pin-submit").addEventListener("click", async () => {
      const pin = [...document.querySelectorAll(".pin-input")]
        .map(i => i.value)
        .join("");

      const { data } = await supa
        .from("secret_santa_pins")
        .select("name")
        .eq("pin", pin)
        .maybeSingle();

      if (!data) {
        document.getElementById("pin-error").innerText = "Fel PIN-kod";
        document.querySelectorAll(".pin-input").forEach(i => i.value = "");
        document.getElementById("pin-0").focus();
        return;
      }

      currentUserName = data.name;

      showPage("confirm-section");
      document.getElementById("confirm-text").innerText = `Är du ${currentUserName}?`;
    });

    /* ---------------------------------------------------
       BEKRÄFTA NAMN
    --------------------------------------------------- */
    document.getElementById("confirm-yes").addEventListener("click", () => {
      sessionStorage.setItem("loggedInUser", currentUserName);

      showPage("main-section");
      document.getElementById("logged-in-name").innerText = currentUserName;
    });

    document.getElementById("confirm-no").addEventListener("click", () => {
      resetAll();
      showPage("welcome-section");
    });

    /* ---------------------------------------------------
       SECRET SANTA-LOGIK
    --------------------------------------------------- */
    async function draw() {
      const giver = currentUserName;

      const { data: group } = await supa
        .from("secret_santa_groups")
        .select("assignments")
        .eq("group_id", groupId)
        .single();

      const receiver = group.assignments[giver];

      const resultEl = document.getElementById("result");

      /* Visa "Du fick:" DIREKT */
      resultEl.innerHTML = `<span class="subtitle-large">Du fick:</span>`;
      resultEl.classList.add("reveal");

      /* Efter 600 ms: visa namnet + konfetti */
      setTimeout(() => {
        resultEl.innerHTML =
          `<span class="subtitle-large">Du fick:</span>\n` +
          `<span id="winner-name" class="name-big">${receiver}</span>`;

        const nameEl = document.getElementById("winner-name");
        launchConfettiFromElement(nameEl);

        /* Visa Börja om-knappen när konfettin är klar */
        setTimeout(() => {
          document.getElementById("restart-button").classList.add("visible");
        }, 1600);

      }, 600);
    }

    document.getElementById("draw-button").addEventListener("click", draw);

    /* ---------------------------------------------------
       BÖRJA OM
    --------------------------------------------------- */
    document.getElementById("restart-button").addEventListener("click", () => {
      resetAll();
      showPage("welcome-section");
    });

  </script>

</body>
</html>
