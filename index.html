<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Familjen Åhlunds Secret Santa 🎅</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    /* --- JULBAKGRUND --- */
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: url("https://images.unsplash.com/photo-1543589077-47d81606c1bf?auto=format&fit=crop&w=800&q=60")
                  no-repeat center/cover;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* --- FÄRGER --- */
    :root {
      --rosa: rgba(255, 210, 220, 0.92);
      --rosa-dark: #d47a8c;
      --rosa-hover: #b85f72;
    }

    /* --- SEKTIONER (nu responsiva och autoanpassade) --- */
    #welcome-section, #confirm-section, #main-section {
      background: var(--rosa);
      width: min(90%, 600px);
      min-height: min(85vh, 800px);
      padding: 40px 30px;
      border-radius: 25px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
      backdrop-filter: blur(5px);
      display: none;
      text-align: center;
    }

    /* --- TEXTSTORLEKAR (konsekventa och större) --- */
    .title-biggest {
      font-size: clamp(42px, 12vw, 72px);
      font-weight: 800;
      line-height: 1.2;
      white-space: pre-line;
      margin-bottom: 30px;
    }

    .subtitle-large {
      font-size: clamp(32px, 9vw, 52px);
      font-weight: 600;
      margin-bottom: 35px;
    }

    .normal-text {
      font-size: clamp(28px, 8vw, 44px);
      margin-bottom: 25px;
    }

    /* --- PIN-RUTOR --- */
    .pin-wrapper {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 30px;
    }

    .pin-input {
      width: 75px;
      height: 90px;
      font-size: clamp(36px, 10vw, 52px);
      text-align: center;
      border: 2px solid #aaa;
      border-radius: 12px;
      background: white;
    }

    .pin-input:focus {
      border-color: var(--rosa-dark);
      outline: none;
      transform: scale(1.05);
    }

    /* --- KNAPPAR (konsekventa färger) --- */
    button {
      padding: 18px;
      font-size: clamp(28px, 8vw, 44px);
      font-weight: 700;
      background: var(--rosa-dark);
      color: white;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover:not(:disabled) {
      background: var(--rosa-hover);
      transform: scale(1.02);
    }

    button:disabled {
      background: #e3b6c0;
    }

    /* --- FORTSÄTT-KNAPP (lika bred som PIN-rutorna) --- */
    #pin-submit {
      width: calc(75px * 4 + 18px * 3);
      max-width: 100%;
      margin: 0 auto;
      display: block;
    }

    /* --- DRA NAMN-KNAPP (smalare) --- */
    #draw-button {
      width: 70%;
      margin: 0 auto;
      display: block;
    }

    /* --- RESULTAT MED COOL EFFEKT --- */
    #result {
      margin-top: 30px;
      font-size: clamp(34px, 10vw, 56px);
      font-weight: bold;
      color: #006600;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.6s ease, transform 0.6s ease;
      white-space: pre-line;
    }

    .reveal {
      opacity: 1 !important;
      transform: scale(1) !important;
    }

    /* Extra space över “Är du X?” */
    #confirm-text {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <!-- STARTSKÄRM -->
  <div id="welcome-section">
    <div class="title-biggest">
Välkommen till
Familjen Åhlunds
Superhäftiga
secret santa-lotteri!
    </div>

    <div class="subtitle-large">Skriv in din pinkod</div>

    <div class="pin-wrapper">
      <input id="pin-0" maxlength="1" class="pin-input" inputmode="numeric" type="tel" />
      <input id="pin-1" maxlength="1" class="pin-input" inputmode="numeric" type="tel" />
      <input id="pin-2" maxlength="1" class="pin-input" inputmode="numeric" type="tel" />
      <input id="pin-3" maxlength="1" class="pin-input" inputmode="numeric" type="tel" />
    </div>

    <button id="pin-submit" disabled>Fortsätt</button>
    <p id="pin-error" class="normal-text" style="color:red;"></p>
  </div>

  <!-- BEKRÄFTA NAMN -->
  <div id="confirm-section">
    <div id="confirm-text" class="title-biggest"></div>
    <button id="confirm-yes">Ja</button>
    <button id="confirm-no" style="margin-top:20px;">Nej</button>
  </div>

  <!-- HUVUDSIDA -->
  <div id="main-section">
    <div class="title-biggest">Secret Santa</div>

    <div class="subtitle-large">Du är inloggad som</div>
    <div id="logged-in-name" class="subtitle-large" style="font-weight:bold;"></div>

    <button id="draw-button">Dra namn</button>

    <p id="result"></p>
  </div>

  <script>
    /* ---------------------------------------------------
       STARTSKÄRM + SESSION
    --------------------------------------------------- */
    document.addEventListener("DOMContentLoaded", () => {
      const savedUser = sessionStorage.getItem("loggedInUser");

      if (savedUser) {
        currentUserName = savedUser;
        document.getElementById("main-section").style.display = "block";
        document.getElementById("logged-in-name").innerText = savedUser;
        return;
      }

      document.getElementById("welcome-section").style.display = "block";

      const inputs = document.querySelectorAll(".pin-input");
      const submitBtn = document.getElementById("pin-submit");

      inputs[0].focus();

      inputs.forEach((input, index) => {
        input.addEventListener("input", () => {
          input.value = input.value.replace(/[^0-9]/g, "");

          if (input.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }

          const pin = [...inputs].map(i => i.value).join("");
          submitBtn.disabled = pin.length !== 4;

          if (pin.length === 4) {
            submitBtn.focus();
          }
        });

        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && !input.value && index > 0) {
            inputs[index - 1].focus();
          }
        });
      });
    });

    /* ---------------------------------------------------
       SUPABASE-KONFIG
    --------------------------------------------------- */
    const SUPABASE_URL = "https://qktwixlydcpjuvnbgxza.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrdHdpeGx5ZGNwanV2bmJneHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYwODE3NzgsImV4cCI6MjA4MTY1Nzc3OH0.9Z4yEXtsO6rXPutvzmymFeu-KvQA4_604pJfDt0XzQU";

    const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const PARTICIPANTS = [
      "Iren","Jonas","Joakim","Dunis","Juli","Sam","Klas","Martha",
      "Ia","Lita","Kennedy","Johannes","Rebecka","Betty","Bodil",
      "Anna","Essi","Udo"
    ];

    const groupId = "familj2025";
    let currentUserName = null;

    /* ---------------------------------------------------
       PIN-KONTROLL
    --------------------------------------------------- */
    document.getElementById("pin-submit").addEventListener("click", async () => {
      const pin = [...document.querySelectorAll(".pin-input")]
        .map(i => i.value)
        .join("")
        .trim();

      if (pin.length !== 4) return;

      const { data } = await supa
        .from("secret_santa_pins")
        .select("name")
        .eq("pin", pin)
        .maybeSingle();

      if (!data) {
        document.getElementById("pin-error").innerText = "Fel PIN-kod";

        const inputs = document.querySelectorAll(".pin-input");
        inputs.forEach(i => i.value = "");
        inputs[0].focus();
        return;
      }

      currentUserName = data.name;

      document.getElementById("welcome-section").style.display = "none";
      document.getElementById("confirm-section").style.display = "block";
      document.getElementById("confirm-text").innerText = `Är du ${currentUserName}?`;
    });

    /* ---------------------------------------------------
       BEKRÄFTA NAMN
    --------------------------------------------------- */
    document.getElementById("confirm-yes").addEventListener("click", () => {
      sessionStorage.setItem("loggedInUser", currentUserName);

      document.getElementById("confirm-section").style.display = "none";
      document.getElementById("main-section").style.display = "block";
      document.getElementById("logged-in-name").innerText = currentUserName;
    });

    document.getElementById("confirm-no").addEventListener("click", () => {
      sessionStorage.clear();
      location.reload();
    });

    /* ---------------------------------------------------
       SECRET SANTA-LOGIK
    --------------------------------------------------- */
    function createAssignments(names) {
      let receivers;
      do {
        receivers = [...names];
        for (let i = receivers.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [receivers[i], receivers[j]] = [receivers[j], receivers[i]];
        }
      } while (names.some((n, i) => n === receivers[i]));

      return Object.fromEntries(names.map((n, i) => [n, receivers[i]]));
    }

    async function ensureGroup() {
      const { data } = await supa
        .from("secret_santa_groups")
        .select("*")
        .eq("group_id", groupId)
        .maybeSingle();

      if (!data) {
        const assignments = createAssignments(PARTICIPANTS);
        await supa
          .from("secret_santa_groups")
          .insert({ group_id: groupId, assignments });
      }
    }

    async function draw() {
      const giver = currentUserName;

      const { data: group } = await supa
        .from("secret_santa_groups")
        .select("assignments")
        .eq("group_id", groupId)
        .single();

      const receiver = group.assignments[giver];

      await supa
        .from("secret_santa")
        .insert({ group_id: groupId, giver, receiver });

      const resultEl = document.getElementById("result");
      resultEl.innerText = `Du fick:\n${receiver}`;
      resultEl.classList.remove("reveal");
      setTimeout(() => resultEl.classList.add("reveal"), 50);
    }

    document.getElementById("draw-button").addEventListener("click", draw);

    ensureGroup();
  </script>

</body>
</html>
