<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Test PIN</title>

<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
  }

  .pin-input {
    width: 40px;
    height: 50px;
    font-size: 32px;
    text-align: center;
  }
</style>
</head>

<body>

<h2>Test av PIN</h2>

<div id="pin-section">
  <h3>Skriv in din PIN-kod</h3>

  <div style="display:flex; gap:10px;">
    <input id="pin-0" maxlength="1" class="pin-input" />
    <input id="pin-1" maxlength="1" class="pin-input" />
    <input id="pin-2" maxlength="1" class="pin-input" />
    <input id="pin-3" maxlength="1" class="pin-input" />
  </div>

  <button id="pin-submit" disabled>Fortsätt</button>
  <p id="pin-error" style="color:red;"></p>
</div>

<script>
  const inputs = document.querySelectorAll(".pin-input");
  const submitBtn = document.getElementById("pin-submit");

  inputs.forEach((input, index) => {
    input.addEventListener("input", () => {
      input.value = input.value.replace(/[^0-9]/g, "");

      if (input.value && index < 3) {
        inputs[index + 1].focus();
      }

      const pin = [...inputs].map(i => i.value).join("");
      submitBtn.disabled = pin.length !== 4;
    });
  });

  submitBtn.addEventListener("click", () => {
    const pin = [...inputs].map(i => i.value).join("");
    alert("PIN är: " + pin);
  });
</script>

</body>
</html>
