<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <title>Familjen Åhlunds Secret Santa 2025 🎅</title>

  <!-- Supabase JS v2 via jsDelivr (UMD, global "supabase"). -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

  <style>
    body {
      font-family: sans-serif;
      background: #fff0f5;
      padding: 40px;
      max-width: 650px;
      margin: auto;
      text-align: center;
    }
    h2 { color: #d6336c; }
    select, button {
      width: 80%;
      padding: 12px;
      margin-top: 16px;
      font-size: 16px;
    }
    button {
      background-color: #28a745;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
    button:hover {
      background-color: #218838;
    }
    #result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
    #status {
      margin-top: 8px;
      color: #6c757d;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h2>🎁 Familjen Åhlunds häftiga Secret Santa 2025 🎁</h2>
  <p>Välj vem som ska dra:</p>
  <select id="giver"></select>
  <button id="drawBtn">Dra namn</button>
  <p id="result"></p>
  <p id="status"></p>

  <!-- App-kod. Körs efter att Supabase-CDN har laddats tack vare defer. -->
  <script defer>
    // ------ Konfiguration ------
    const SUPABASE_URL = "https://qktwixlydcpjuvnbgxza.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrdHdpeGx5ZGNwanV2bmJneHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYwODE3NzgsImV4cCI6MjA4MTY1Nzc3OH0.9Z4yEXtsO6rXPutvzmymFeu-KvQA4_604pJfDt0XzQU";

    const PARTICIPANTS = [
      "Iren","Jonas","Joakim","Dunis","Juli","Sam","Klas","Martha",
      "Ia","Lita","Kennedy","Johannes","Rebecka","Betty","Bodil",
      "Anna","Essi","Udo"
    ];
    const groupId = "familj2025";

    // ------ Hjälp/DOM ------
    const $giver = document.getElementById("giver");
    const $status = document.getElementById("status");
    const $result = document.getElementById("result");
    const $drawBtn = document.getElementById("drawBtn");

    function setStatus(msg) {
      $status.textContent = msg ?? "";
    }

    function log(...args) {
      console.log("[SecretSanta]", ...args);
    }

    function fillDropdown(names) {
      $giver.innerHTML = "";
      if (!names || names.length === 0) {
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "Alla har dragit 🎄";
        $giver.appendChild(opt);
        return;
      }
      for (const name of names) {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        $giver.appendChild(opt);
      }
    }

    // Direkt: visa ALLA namn så UI fungerar även om nätverket/policies strular.
    fillDropdown(PARTICIPANTS);

    // ------ Supabase init via CDN (UMD) ------
    (async function init() {
      try {
        // Kontroll: finns global "supabase"?
        if (typeof supabase === "undefined") {
          setStatus("Kunde inte ladda Supabase-klienten. Kontrollera nätverk.");
          console.error("Supabase CDN kunde inte laddas (global 'supabase' saknas).");
          return;
        }

        // UMD-sättet: supabase.createClient(...)
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 1) Se till att gruppen finns
        await ensureGroup(db);

        // 2) Hämta vilka som redan dragit och uppdatera dropdownen
        await refreshRemaining(db);

        // 3) Knyt knapp
        $drawBtn.addEventListener("click", () => draw(db));

        setStatus("Klar.");
      } catch (e) {
        setStatus("Ett fel uppstod vid init.");
        console.error(e);
      }
    })();

    // Skapa säker lottning (ingen får sig själv)
    function createAssignments(names) {
      let receivers;
      do {
        receivers = [...names];
        // Fisher–Yates-shuffle
        for (let i = receivers.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [receivers[i], receivers[j]] = [receivers[j], receivers[i]];
        }
      } while (names.some((n, i) => n === receivers[i])); // se till att ingen får sig själv

      return Object.fromEntries(names.map((n, i) => [n, receivers[i]]));
    }

    async function ensureGroup(db) {
      setStatus("Initierar grupp...");

      const { data, error } = await db
        .from("secret_santa_groups")
        .select("group_id")
        .eq("group_id", groupId)
        .maybeSingle();

      if (error) {
        // RLS SELECT kan fela; vi försöker skapa grupp ändå.
        log("Fel vid select secret_santa_groups (kan vara RLS):", error);
      }

      if (!data) {
        const assignments = createAssignments(PARTICIPANTS);
        const { error: insErr } = await db
          .from("secret_santa_groups")
          .insert({ group_id: groupId, assignments }, { returning: "minimal" });

        if (insErr) {
          log("Fel vid insert secret_santa_groups (kan vara RLS):", insErr);
        } else {
          log("Grupp skapad.");
        }
      } else {
        log("Grupp finns redan.");
      }
    }

    async function refreshRemaining(db) {
      setStatus("Laddar dragna givare...");

      const { data, error } = await db
        .from("secret_santa")
        .select("giver")
        .eq("group_id", groupId);

      if (error) {
        // Om SELECT blockeras av RLS, behåll alla namn
        log("Kunde inte läsa secret_santa (RLS/policy?):", error);
        setStatus("Klar (kunde inte läsa dragna namn, visar alla).");
        return;
      }

      const used = (data || []).map(r => r.giver);
      const remaining = PARTICIPANTS.filter(n => !used.includes(n));

      fillDropdown(remaining);
      setStatus("Klar.");
    }

    async function draw(db) {
      const giver = $giver.value;
      if (!giver || giver === "Alla har dragit 🎄") return;

      // Hämta assignments
      const { data: group, error } = await db
        .from("secret_santa_groups")
        .select("assignments")
        .eq("group_id", groupId)
        .maybeSingle();

      if (error || !group) {
        $result.textContent = "Kunde inte hämta lottning (saknas policy/anslutning).";
        console.error("Fel vid select secret_santa_groups:", error);
        return;
      }

      const receiver = group.assignments[giver];
      if (!receiver) {
        $result.textContent = "Hittade ingen mottagare för " + giver;
        return;
      }

      const { error: insErr } = await db
        .from("secret_santa")
        .insert({ group_id: groupId, giver, receiver }, { returning: "minimal" });

      if (insErr) {
        $result.textContent = "Kunde inte spara dragningen (kontrollera RLS/policy).";
        console.error("Fel vid insert secret_santa:", insErr);
        return;
      }

      // DEN HÄR RADEN VAR FEL FÖRUT – nu är den korrekt:
      $result.textContent = `🎄 ${giver} fick: ${receiver}`;

      // Uppdatera dropdownen med de återstående givarna
      await refreshRemaining(db);
    }
  </script>
</body>
</html>
