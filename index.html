<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Familjen Åhlunds Secret Santa 2025 🎅</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
body { font-family: sans-serif; background: #fff0f5; padding: 40px; max-width: 520px; margin: auto; text-align: center; }
h2 { color: #d6336c; }
select, button { width: 100%; padding: 12px; margin-top: 10px; font-size: 10px; }
button { background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px; }
button:hover { background-color: #218838; }
#result { margin-top: 20px; font-size: 18px; font-weight: bold; }
</style>
</head>
<body>
<h2>🎁 Familjen Åhlunds häftiga Secret Santa 2025</h2>
<p>Välj vem som ska dra:</p>
<select id="giver"></select>
<button onclick="draw()">Dra namn</button>
<p id="result"></p>

<script>
const SUPABASE_URL = "https://qktwixlydcpjuvnbgxza.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrdHdpeGx5ZGNwanV2bmJneHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYwODE3NzgsImV4cCI6MjA4MTY1Nzc3OH0.9Z4yEXtsO6rXPutvzmymFeu-KvQA4_604pJfDt0XzQU";
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Lista på deltagare
const PARTICIPANTS = ["Iren","Jonas","Joakim","Dunis","Juli","Sam","Klas","Martha","Ia","Lita","Kennedy","Johannes","Rebecka","Betty","Bodil","Anna","Essi","Udo"];
const groupId = "familj2025";

// Skapa säker lottning
function createAssignments(names) {
let receivers;
do {
receivers = [...names];
for (let i = receivers.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[receivers[i], receivers[j]] = [receivers[j], receivers[i]];
}
} while (names.some((n,i) => n === receivers[i]));
return Object.fromEntries(names.map((n,i)=>[n, receivers[i]]));
}

// Initiera grupp
async function ensureGroup() {
const { data } = await supabase.from("secret_santa_groups").select("*").eq("group_id", groupId).single();
if (!data) {
const assignments = createAssignments(PARTICIPANTS);
await supabase.from("secret_santa_groups").insert({ group_id: groupId, assignments });
}
}

// Ladda givers som inte dragit ännu
async function loadGivers() {
const { data } = await supabase.from("secret_santa").select("giver").eq("group_id", groupId);
const used = data.map(x => x.giver);
const select = document.getElementById("giver");
select.innerHTML = "";
PARTICIPANTS.filter(name => !used.includes(name)).forEach(name => {
const option = document.createElement("option");
option.value = name;
option.textContent = name;
select.appendChild(option);
});
if (!select.children.length) {
select.innerHTML = "<option>Alla har dragit 🎄</option>";
}
}

// Dra namn
async function draw() {
const giver = document.getElementById("giver").value;
if (!giver) return;

const { data: group } = await supabase.from("secret_santa_groups").select("assignments").eq("group_id", groupId).single();
const receiver = group.assignments[giver];

await supabase.from("secret_santa").insert({ group_id: groupId, giver, receiver });
document.getElementById("result").innerText = `🎄 ${giver} fick: ${receiver}`;
loadGivers();
}

// Start
ensureGroup().then(loadGivers);
</script>
</body>
</html>
