<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Familjen Åhlunds Secret Santa 🎅</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    /* --- JULBAKGRUND --- */
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: url("https://images.unsplash.com/photo-1543589077-47d81606c1bf?auto=format&fit=crop&w=800&q=60")
                  no-repeat center/cover;
      min-height: 100vh;
      overflow-x: hidden;

      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 4vh;
    }

    /* --- FÄRGER --- */
    :root {
      --rosa: rgba(255, 210, 220, 0.92);
      --rosa-dark: #d47a8c;
      --rosa-hover: #b85f72;
      --result-color: #b30000;
    }

    /* --- IDENTISK RUTA PÅ ALLA SIDOR --- */
    .page-box {
      background: var(--rosa);
      width: min(95%, 680px);   /* bredare */
      height: 68vh;             /* lägre */
      padding: 30px 25px;       /* mindre space */
      border-radius: 25px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
      backdrop-filter: blur(5px);

      display: none; /* viktigt */

      flex-direction: column;
      justify-content: flex-start;
      align-items: center;

      overflow-y: auto;
      text-align: center;
    }

    /* --- TEXTSTORLEKAR --- */
    .title-biggest {
      font-size: clamp(44px, 11vw, 70px);
      font-weight: 800;
      line-height: 1.15;
      white-space: pre-line;
      margin-bottom: 15px;
    }

    .emoji-line {
      font-size: clamp(40px, 10vw, 60px);
      margin-bottom: 20px;
    }

    .subtitle-large {
      font-size: clamp(34px, 9vw, 52px);
      font-weight: 600;
      margin-bottom: 25px;
    }

    .normal-text {
      font-size: clamp(28px, 8vw, 42px);
      margin-bottom: 15px;
    }

    .bigger-text {
      font-size: clamp(40px, 11vw, 62px);
      font-weight: 700;
    }

    /* --- PIN-RUTOR --- */
    .pin-wrapper {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 25px;
    }

    .pin-input {
      width: 75px;
      height: 90px;
      font-size: clamp(36px, 10vw, 52px);
      text-align: center;
      border: 2px solid #aaa;
      border-radius: 12px;
      background: white;
    }

    .pin-input:focus {
      border-color: var(--rosa-dark);
      outline: none;
      transform: scale(1.05);
    }

    /* --- KNAPPAR --- */
    button {
      padding: 16px;
      font-size: clamp(28px, 8vw, 42px);
      font-weight: 700;
      background: var(--rosa-dark);
      color: white;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover:not(:disabled) {
      background: var(--rosa-hover);
      transform: scale(1.02);
    }

    button:disabled {
      background: #e3b6c0;
    }

    /* --- FORTSÄTT-KNAPP --- */
    #pin-submit {
      width: calc(75px * 4 + 18px * 3);
      max-width: 100%;
      margin: 0 auto;
      display: block;
    }

    /* --- DRA NAMN-KNAPP (smalare) --- */
    #draw-button {
      width: 55%;
      margin: 0 auto;
      display: block;
    }

    /* --- RESULTAT MED PAUS + EFFEKT --- */
    #result {
      margin-top: 25px;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.6s ease, transform 0.6s ease;
      white-space: pre-line;
    }

    .reveal {
      opacity: 1 !important;
      transform: scale(1) !important;
    }

    /* --- KONFETTI --- */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      background: red;
      top: -10px;
      animation: fall 1.5s linear forwards;
      border-radius: 2px;
      opacity: 0.9;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }

  </style>
</head>

<body>

  <!-- STARTSKÄRM -->
  <div id="welcome-section" class="page-box">
    <div class="title-biggest">
Välkommen till
Familjen Åhlunds
Superhäftiga secret santa-lotteri!
    </div>

    <div class="emoji-line">🎁</div>

    <div class="subtitle-large">Skriv in din pinkod</div>

    <div class="pin-wrapper">
      <input id="pin-0" maxlength="1" class="pin-input" inputmode="numeric" type="tel" />
      <input id="pin-1" maxlength="1" class="pin-input" inputmode="numeric" type="tel" />
      <input id="pin-2" maxlength="1" class="pin-input" inputmode="numeric" type="tel" />
      <input id="pin-3" maxlength="1" class="pin-input" inputmode="numeric" type="tel" />
    </div>

    <button id="pin-submit" disabled>Fortsätt</button>
    <p id="pin-error" class="normal-text" style="color:red;"></p>
  </div>

  <!-- BEKRÄFTA NAMN -->
  <div id="confirm-section" class="page-box">
    <div id="confirm-text" class="title-biggest"></div>
    <button id="confirm-yes">Ja</button>
    <button id="confirm-no" style="margin-top:20px;">Nej</button>
  </div>

  <!-- HUVUDSIDA -->
  <div id="main-section" class="page-box">
    <div class="title-biggest">Secret Santa</div>

    <div class="emoji-line">🎅</div>

    <div class="subtitle-large">Du är inloggad som</div>
    <div id="logged-in-name" class="bigger-text" style="font-weight:bold;"></div>

    <button id="draw-button">Dra namn</button>

    <p id="result"></p>
  </div>

  <script>
    /* ---------------------------------------------------
       HJÄLPFUNKTION: VISA EN SIDA
    --------------------------------------------------- */
    function showPage(id) {
      document.querySelectorAll(".page-box").forEach(box => box.style.display = "none");
      document.getElementById(id).style.display = "flex";
      window.scrollTo(0, 0);
    }

    /* ---------------------------------------------------
       KONFETTI
    --------------------------------------------------- */
    function launchConfetti() {
      for (let i = 0; i < 40; i++) {
        const c = document.createElement("div");
        c.classList.add("confetti");
        c.style.left = Math.random() * 100 + "vw";
        c.style.background = ["#ff4d4d", "#ffcc00", "#66cc66"][Math.floor(Math.random() * 3)];
        c.style.animationDuration = (1 + Math.random()) + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 2000);
      }
    }

    /* ---------------------------------------------------
       STARTSKÄRM + SESSION
    --------------------------------------------------- */
    document.addEventListener("DOMContentLoaded", () => {
      const savedUser = sessionStorage.getItem("loggedInUser");

      if (savedUser) {
        currentUserName = savedUser;
        showPage("main-section");
        document.getElementById("logged-in-name").innerText = savedUser;
        return;
      }

      showPage("welcome-section");

      const inputs = document.querySelectorAll(".pin-input");
      const submitBtn = document.getElementById("pin-submit");

      inputs[0].focus();

      inputs.forEach((input, index) => {
        input.addEventListener("input", () => {
          input.value = input.value.replace(/[^0-9]/g, "");

          if (input.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }

          const pin = [...inputs].map(i => i.value).join("");
          submitBtn.disabled = pin.length !== 4;

          if (pin.length === 4) submitBtn.focus();
        });

        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && !input.value && index > 0) {
            inputs[index - 1].focus();
          }
        });
      });
    });

    /* ---------------------------------------------------
       SUPABASE-KONFIG
    --------------------------------------------------- */
    const SUPABASE_URL = "https://qktwixlydcpjuvnbgxza.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrdHdpeGx5ZGNwanV2bmJneHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYwODE3NzgsImV4cCI6MjA4MTY1Nzc3OH0.9Z4yEXtsO6rXPutvzmymFeu-KvQA4_604pJfDt0XzQU";

    const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const PARTICIPANTS = [
      "Iren","Jonas","Joakim","Dunis","Juli","Sam","Klas","Martha",
      "Ia","Lita","Kennedy","Johannes","Rebecka","Betty","Bodil",
      "Anna","Essi","Udo"
    ];

    const groupId = "familj2025";
    let currentUserName = null;

    /* ---------------------------------------------------
       PIN-KONTROLL
    --------------------------------------------------- */
    document.getElementById("pin-submit").addEventListener("click", async () => {
      const pin = [...document.querySelectorAll(".pin-input")]
        .map(i => i.value)
        .join("");

      const { data } = await supa
        .from("secret_santa_pins")
        .select("name")
        .eq("pin", pin)
        .maybeSingle();

      if (!data) {
        document.getElementById("pin-error").innerText = "Fel PIN-kod";
        document.querySelectorAll(".pin-input").forEach(i => i.value = "");
        document.getElementById("pin-0").focus();
        return;
      }

      currentUserName = data.name;

      showPage("confirm-section");
      document.getElementById("confirm-text").innerText = `Är du ${currentUserName}?`;
    });

    /* ---------------------------------------------------
       BEKRÄFTA NAMN
    --------------------------------------------------- */
    document.getElementById("confirm-yes").addEventListener("click", () => {
      sessionStorage.setItem("loggedInUser", currentUserName);

      showPage("main-section");
      document.getElementById("logged-in-name").innerText = currentUserName;
    });

    document.getElementById("confirm-no").addEventListener("click", () => {
      sessionStorage.clear();
      location.reload();
    });

    /* ---------------------------------------------------
       SECRET SANTA-LOGIK
    --------------------------------------------------- */
    function createAssignments(names) {
      let receivers;
      do {
        receivers = [...names];
        for (let i = receivers.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [receivers[i], receivers[j]] = [receivers[j], receivers[i]];
        }
      } while (names.some((n, i) => n === receivers[i]));

      return Object.fromEntries(names.map((n, i) => [n, receivers[i]]));
    }

    async function ensureGroup() {
      const { data } = await supa
        .from("secret_santa_groups")
        .select("*")
        .eq("group_id", groupId)
        .maybeSingle();

      if (!data) {
        const assignments = createAssignments(PARTICIPANTS);
        await supa
          .from("secret_santa_groups")
          .insert({ group_id: groupId, assignments });
      }
    }

    async function draw() {
      const giver = currentUserName;

      const { data: group } = await supa
        .from("secret_santa_groups")
        .select("assignments")
        .eq("group_id", groupId)
        .single();

      const receiver = group.assignments[giver];

      const resultEl = document.getElementById("result");

      /* Visa "Du fick:" först */
      resultEl.innerHTML = `<span class="subtitle-large">Du fick:</span>`;
      resultEl.classList.remove("reveal");
      setTimeout(() => resultEl.classList.add("reveal"), 50);

      /* Efter 600 ms: visa namnet + konfetti */
      setTimeout(() => {
        resultEl.innerHTML =
          `<span class="subtitle-large">Du fick:</span>\n` +
          `<span class="bigger-text" style="color: var(--result-color);">${receiver}</span>`;

        launchConfetti();

      }, 600);
    }

    document.getElementById("draw-button").addEventListener("click", draw);

    ensureGroup();
  </script>

</body>
</html>
